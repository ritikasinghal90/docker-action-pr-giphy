name: Test Workflow

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  testing-action:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      
      - name: Post PR Comment
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          giphy-api-token: ${{ secrets.GIPHY_API_TOKEN }}